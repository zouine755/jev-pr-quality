name: PR Event Demo with RawTree WIF

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pr-event-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  log-sample-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: workload-federation-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create sample review and write to RawTree with WIF
        shell: bash
        env:
          RAWTREE_FEDERATION_RULE_ID: ${{ vars.RAWTREE_FEDERATION_RULE_ID }}
          RAWTREE_AUDIENCE: ${{ vars.RAWTREE_AUDIENCE || 'rawtree' }}
          RAWTREE_JEV_DATABASE: ${{ vars.RAWTREE_JEV_DATABASE }}
          RAWTREE_JEV_TABLE: ${{ vars.RAWTREE_JEV_TABLE || 'jev_pr_reviews' }}
          RAWTREE_JEV_BASE_URL: ${{ vars.RAWTREE_JEV_BASE_URL || 'https://api.rawtree.com' }}
        run: node scripts/jev-review/log-sample-rawtree.mjs
