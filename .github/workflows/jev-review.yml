name: Jev Review with RawTree WIF

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: workload-federation-demo
    steps:
      - name: Check out pull request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Jev review and log to RawTree
        uses: ./
        with:
          jev-api-key: ${{ secrets.JEV_API_KEY }}
          minimum-score: ${{ vars.JEV_MIN_SCORE || '7' }}
          rawtree-federation-rule-id: ${{ vars.RAWTREE_FEDERATION_RULE_ID }}
          rawtree-audience: ${{ vars.RAWTREE_AUDIENCE || 'rawtree' }}
          rawtree-database: ${{ vars.RAWTREE_JEV_DATABASE }}
          rawtree-table: ${{ vars.RAWTREE_JEV_TABLE || 'jev_pr_reviews' }}
          rawtree-base-url: ${{ vars.RAWTREE_JEV_BASE_URL || 'https://api.rawtree.com' }}
